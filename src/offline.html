<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Configure My AI</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f4;
      color: #231d1b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #100c0b; color: #f4f1ef; }
    }
    main { text-align: center; padding: 48px 24px; max-width: 22rem; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; opacity: 0.75; line-height: 1.5; font-size: 0.9rem; }
    button {
      font: inherit; padding: 9px 20px; border: 0; border-radius: 999px;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Can’t reach Configure My AI</h1>
    <p>The Code panel is a window onto configuremyai.com, so it needs the network. It retries on its own every few seconds.</p>
    <button type="button" onclick="retry()">Retry now</button>
  </main>
  <script>
    var target = new URLSearchParams(location.search).get('retry') || 'https://configuremyai.com/code'
    if (!/^https?:\/\//.test(target)) target = 'https://configuremyai.com/code'
    function retry () { location.replace(target) }
    addEventListener('online', retry)
    setInterval(function () { if (navigator.onLine) retry() }, 10000)
  </script>
</body>
</html>
